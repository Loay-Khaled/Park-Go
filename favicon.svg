<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pinGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer squircle container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Stylized Pin / "P" monogram -->
  <g filter="url(#shadow)">
    <!-- Main P stem and loop -->
    <path d="M20 48V16H34C40.6274 16 46 21.3726 46 28C46 34.6274 40.6274 40 34 40H28V48H20Z" fill="url(#pgGradient)"/>
    <!-- Inner cutout of P forming a location marker / arrow indicator -->
    <circle cx="33" cy="28" r="5" fill="#0B132B" />
    <!-- Dynamic mobility dot / arrow accent -->
    <path d="M43 38L47 42L43 46" stroke="url(#pinGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
