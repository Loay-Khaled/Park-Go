<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="60%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#141E34" />
    </linearGradient>

    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="cardGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .font-mono { font-family: 'Space Grotesk', monospace; font-weight: 700; }
  </style>

  <!-- Background Base / Presentation Canvas -->
  <rect width="1050" height="600" fill="#030712"/>

  <!-- Business Card Frame (3.5" x 2" standard proportions: 950 x 500 with 50px margins) -->
  <g transform="translate(50, 50)" filter="url(#cardShadow)">
    <!-- Card Body -->
    <rect width="950" height="500" rx="24" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2"/>
    <rect width="950" height="500" rx="24" fill="url(#cardGlow)"/>

    <!-- Left Accent Edge Line -->
    <path d="M 0,40 Q 0,0 40,0 L 40,500 Q 0,500 0,460 Z" fill="url(#pGrad)" opacity="0.85"/>

    <!-- Left Brand Section -->
    <g transform="translate(70, 55)">
      <!-- Mini Park & Go Logo -->
      <g transform="translate(0, 0)">
        <rect width="48" height="48" rx="12" fill="#0A0F1D" stroke="#2563EB" stroke-width="2"/>
        <path d="M16 34V14H26C30.4 14 34 17.6 34 22C34 26.4 30.4 30 26 30H21V34H16Z" fill="url(#pGrad)"/>
        <circle cx="25" cy="22" r="3.2" fill="#0A0F1D"/>
      </g>
      <text x="62" y="32" class="font-title" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">Park &amp; Go</text>
      <text x="62" y="48" class="font-body" font-size="11" fill="#10B981" letter-spacing="1.5">SMART MOBILITY &amp; PARKING</text>

      <!-- Founder & Name Title -->
      <g transform="translate(0, 115)">
        <text x="0" y="0" class="font-title" font-size="34" fill="#FFFFFF">Loay Khaled</text>
        <text x="0" y="26" class="font-body" font-size="15" font-weight="700" fill="#3B82F6">Founder &amp; Chief Executive Officer</text>
      </g>

      <!-- Tagline / Value Pitch -->
      <g transform="translate(0, 185)">
        <text x="0" y="0" class="font-body" font-size="13" fill="#94A3B8">Next-Generation Smart Parking Infrastructure</text>
        <text x="0" y="18" class="font-body" font-size="12" fill="#64748B">Commercial Malls • Campuses • Hospitals • Airports</text>
      </g>

      <!-- Contact Info Section -->
      <g transform="translate(0, 245)">
        <!-- Phone & WhatsApp -->
        <g transform="translate(0, 0)">
          <circle cx="12" cy="10" r="12" fill="#1E293B"/>
          <text x="12" y="14" font-size="11" text-anchor="middle" fill="#10B981">📱</text>
          <text x="34" y="14" class="font-mono" font-size="13" fill="#E2E8F0">+20 100 234 5678</text>
        </g>

        <!-- Email -->
        <g transform="translate(0, 36)">
          <circle cx="12" cy="10" r="12" fill="#1E293B"/>
          <text x="12" y="14" font-size="11" text-anchor="middle" fill="#3B82F6">✉️</text>
          <text x="34" y="14" class="font-body" font-size="13" fill="#E2E8F0">partners@parkandgo.io</text>
        </g>

        <!-- Live Website URL -->
        <g transform="translate(0, 72)">
          <circle cx="12" cy="10" r="12" fill="#1E293B"/>
          <text x="12" y="14" font-size="11" text-anchor="middle" fill="#06B6D4">🌐</text>
          <text x="34" y="14" class="font-mono" font-size="13" font-weight="700" fill="#60A5FA">parkandgo-woad.vercel.app</text>
        </g>

        <!-- Headquarters -->
        <g transform="translate(0, 108)">
          <circle cx="12" cy="10" r="12" fill="#1E293B"/>
          <text x="12" y="14" font-size="11" text-anchor="middle" fill="#F59E0B">📍</text>
          <text x="34" y="14" class="font-body" font-size="12" fill="#94A3B8">Alexandria &amp; Cairo, Egypt</text>
        </g>
      </g>
    </g>

    <!-- Right Side: Crisp QR Code Tile -->
    <g transform="translate(630, 60)" filter="url(#tileShadow)">
      <!-- White Tile Frame -->
      <rect width="250" height="380" rx="18" fill="#FFFFFF"/>

      <text x="125" y="36" class="font-title" font-size="15" text-anchor="middle" fill="#0F172A">TEST DRIVE LIVE APP</text>
      <text x="125" y="52" class="font-body" font-size="10" text-anchor="middle" fill="#64748B">Instant Mobile Demo</text>

      <!-- Embedded Vector QR Code (Centered) -->
      <g transform="translate(25, 70)">
        <image href="Park-And-Go-QR-1500px.png" width="200" height="200"/>
      </g>

      <g transform="translate(125, 305)">
        <rect x="-85" y="0" width="170" height="26" rx="6" fill="#F1F5F9"/>
        <text x="0" y="17" class="font-mono" font-size="10" text-anchor="middle" fill="#2563EB">NO APP DOWNLOAD NEEDED</text>
      </g>

      <text x="125" y="352" class="font-body" font-size="9.5" text-anchor="middle" fill="#94A3B8">Point camera to scan</text>
    </g>
  </g>
</svg>
